# Bloodborne / Dark Souls 3 style keyboard and mouse profile.
# Combos are handled by bridge.py, not by the native input parser.
# E = interact/confirm; Space = dodge/sprint/back; Q = lock-on.
cross = e
cross = enter
circle = space
circle = backspace
square = r
triangle = c
l1 = f
r1 = f10
r2 = f11
l2 = f12
l2 = lctrl
l3 = z
r3 = q
r3 = middlebutton
options = escape
touchpad_left = g
touchpad_right = tab
pad_up = up
pad_down = down
pad_left = left
pad_right = right

axis_left_x_minus = a
axis_left_x_plus = d
axis_left_y_minus = w
axis_left_y_plus = s
leftjoystick_halfmode = lalt

mouse_to_joystick = right
mouse_movement_params = 0.5, 1, 0.125
mouse_camera = direct
mouse_camera_sensitivity = 1.0
stick_socd = last
# Keep sprint across brief key gaps and direction changes.
# Bloodborne uses a square movement gate: keep one axis at full deflection.
stick_release_delay_ms = 60
stick_circular = off
stick_turn_rate = 900

# A connected controller remains usable.
cross = cross
circle = circle
square = square
triangle = triangle
l1 = l1
r1 = r1
l2 = l2
r2 = r2
l3 = l3
r3 = r3
options = options
touchpad_left = back
pad_up = pad_up
pad_down = pad_down
pad_left = pad_left
pad_right = pad_right
axis_left_x = axis_left_x
axis_left_y = axis_left_y
axis_right_x = axis_right_x
axis_right_y = axis_right_y

hotkey_toggle_mouse_to_joystick = f7
hotkey_reload_inputs = f8
